<body><div id="status" role="status">正在载入北大楼…</div><header><h1>北大楼</h1><p>南京大学 · 鼓楼校区</p><details><summary>关于这份复原</summary><p>依据南大档案馆平面与立面图制作。部分尺寸、背面和装饰构件仍为估算；爬山虎按照片作季节性示意。</p></details></header><span class="hint">拖动旋转 · 滚轮缩放 · 右键平移</span>
<nav aria-label="模型视角"><button data-view="aerial" aria-pressed="true">全景</button><button data-view="south" aria-pressed="false">南立面</button><button data-view="tower" aria-pressed="false">塔楼细部</button><button data-view="roof" aria-pressed="false">屋顶</button><button id="ivy" aria-pressed="true">爬山虎</button><button id="rotate" aria-pressed="false">自动环绕</button></nav>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const status=document.querySelector('#status');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9e1e5');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.AgXToneMapping;renderer.toneMappingExposure=.9;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,1000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=250;controls.maxPolarAngle=Math.PI*.49;controls.autoRotateSpeed=.55;
const pmrem=new THREE.PMREMGenerator(renderer);const env=new RoomEnvironment();scene.environment=pmrem.fromScene(env,.04).texture;scene.environmentIntensity=.6;env.dispose();pmrem.dispose();
scene.add(new THREE.HemisphereLight(0xdceaff,0x565142,1.2));const sun=new THREE.DirectionalLight(0xfff1da,2.3);sun.position.set(-35,65,50);scene.add(sun);
const views={aerial:[[72,53,104],[0,13.8,3]],south:[[0,22,110],[0,13,2]],tower:[[23,36,38],[0,25,6.3075]],roof:[[43,65,18],[0,17,0]]};
function view(name){camera.position.set(...views[name][0]);controls.target.set(...views[name][1]);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));}view('aerial');
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
const chunkNames=["beidalou_v04.glb.gz.part00","beidalou_v04.glb.gz.part01","beidalou_v04.glb.gz.part02","beidalou_v04.glb.gz.part03","beidalou_v04.glb.gz.part04","beidalou_v04.glb.gz.part05","beidalou_v04.glb.gz.part06","beidalou_v04.glb.gz.part07","beidalou_v04.glb.gz.part08","beidalou_v04.glb.gz.part09","beidalou_v04.glb.gz.part10"];const chunks=[];let total=0;for(let i=0;i<chunkNames.length;i++){const response=await fetch('./model/'+chunkNames[i]);if(!response.ok)throw new Error('模型分片载入失败：'+chunkNames[i]);const value=new Uint8Array(await response.arrayBuffer());chunks.push(value);total+=value.length;status.textContent='正在载入北大楼… '+Math.round((i+1)/chunkNames.length*100)+'%';}const joined=new Uint8Array(total);let offset=0;for(const chunk of chunks){joined.set(chunk,offset);offset+=chunk.length;}
status.textContent='正在展开三维模型…';const bytes=await new Response(new Blob([joined]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
const gltf=await new GLTFLoader().parseAsync(bytes,'./');const model=gltf.scene;scene.add(model);const ivy=[];model.traverse(o=>{if(o.name.startsWith('BD_Ivy_'))ivy.push(o)});
document.querySelector('#ivy').onclick=e=>{const show=e.currentTarget.getAttribute('aria-pressed')!=='true';ivy.forEach(o=>o.visible=show);e.currentTarget.setAttribute('aria-pressed',String(show));};
document.querySelector('#rotate').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate));};
window.__beidalouQA={loaded:true,ivyGroups:ivy.length,objects:0};model.traverse(()=>window.__beidalouQA.objects++);status.hidden=true;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

}catch(error){console.error(error);status.textContent='载入失败：'+error.message+'。请解压全部文件后运行启动脚本，并使用新版 Edge 或 Chrome。';}
